apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: devops

resources:
- ../../base

replicas:
- name: devops-app
  count: 3

images:
- name: devops-app
  newName: ghcr.io/toolikheng/devops-app
  newTag: latest

patches:
- target:
    group: apps
    version: v1
    kind: Deployment
    name: devops-app
  path: deployment-patch.yaml
- target:
    group: networking.k8s.io
    version: v1
    kind: Ingress
    name: devops-app
  path: ingress-patch.yaml
