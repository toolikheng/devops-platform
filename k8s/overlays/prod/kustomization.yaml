apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: devops

resources:
- ../../base

replicas:
- name: devops-app
  count: 3

# Pin an immutable tag that CI pushed (ghcr.io/toolikheng/devops-platform:sha-<7-char commit>).
# To deploy a newer build, change newTag to that commit's sha tag. Avoid master/latest: they move.
images:
- name: devops-app
  newName: ghcr.io/toolikheng/devops-platform
  newTag: sha-cef238f

patches:
- target:
    group: apps
    version: v1
    kind: Deployment
    name: devops-app
  path: deployment-patch.yaml
- target:
    group: networking.k8s.io
    version: v1
    kind: Ingress
    name: devops-app
  path: ingress-patch.yaml
