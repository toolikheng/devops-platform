# The Streamlit UI (port 8501): same image as the API, another command. It calls the API server-side,
# through the policypal-api Service, so the browser never needs the API.
apiVersion: v1
kind: Service
metadata:
  name: policypal-ui
spec:
  selector:
    app.kubernetes.io/name: policypal-ui
  ports:
  - name: http
    port: 8501
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: policypal-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: policypal-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: policypal-ui
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ui
        image: ghcr.io/toolikheng/policypal # tag set by the overlay
        command:
        - streamlit
        - run
        - ui/Chat.py
        - --server.port=8501
        - --server.address=0.0.0.0
        - --server.headless=true
        - --browser.gatherUsageStats=false
        ports:
        - name: http
          containerPort: 8501
        env:
        - name: API_URL
          value: http://policypal-api:8000
        readinessProbe:
          httpGet:
            path: /_stcore/health
            port: 8501
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /_stcore/health
            port: 8501
          periodSeconds: 20
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command: ["sleep", "10"]
        # Measured on k3d: 81Mi steady, 90Mi peak (cgroup memory.peak). The limit leaves room for many sessions.
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
