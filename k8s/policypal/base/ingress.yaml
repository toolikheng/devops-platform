# Only the UI is published, through k3s's bundled Traefik on port 80. The security group lets in only the
# owner's IP on that port.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: policypal
spec:
  ingressClassName: traefik
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: policypal-ui
            port:
              number: 8501
