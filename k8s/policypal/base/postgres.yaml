# Postgres with the pgvector extension, as in PolicyPal's docker-compose.yml. A StatefulSet gives the pod a
# stable name and its own volume (k3s local-path: a folder on the node's disk, gone with the node).
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None # headless: "postgres" resolves straight to the pod
  selector:
    app.kubernetes.io/name: postgres
  ports:
  - name: postgres
    port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      automountServiceAccountToken: false
      # The image's postgres user (999). Starting as non-root skips the entrypoint's chown, which is fine on
      # a new local-path folder that fsGroup makes group-writable.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: postgres
        image: pgvector/pgvector:0.8.7-pg17
        ports:
        - name: postgres
          containerPort: 5432
        env:
        # PolicyPal's first migration runs CREATE EXTENSION vector, so this user is the superuser.
        - name: POSTGRES_USER
          value: policypal
        - name: POSTGRES_DB
          value: policypal
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: policypal-db
              key: POSTGRES_PASSWORD
        # A subfolder of the volume: initdb wants an empty folder it owns.
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        readinessProbe:
          exec:
            command: ["pg_isready", "-h", "127.0.0.1", "-U", "policypal", "-d", "policypal"]
          periodSeconds: 10
          timeoutSeconds: 5
        # Liveness only asks whether the port is open, so a slow recovery after a crash isn't killed.
        livenessProbe:
          tcpSocket:
            port: 5432
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 6
        # Measured on k3d: 71Mi steady, 101Mi peak with the sample policies loaded.
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: local-path
      resources:
        requests:
          storage: 5Gi
