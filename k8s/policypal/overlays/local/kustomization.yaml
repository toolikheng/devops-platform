# The local k3d cluster (make cluster-up): the same objects as aws, tested here first. k3d's load balancer
# maps localhost:8080 to Traefik, which also serves the v1 app, so PolicyPal gets its own host name:
# http://policypal.localhost:8080
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

# Quoted: a commit hash made only of digits would otherwise be a YAML number.
images:
- name: ghcr.io/toolikheng/policypal
  newTag: "5e6ecf1e9beae18ccddc20fe0895cf0790b70553"

patches:
- target:
    kind: Ingress
    name: policypal
  patch: |-
    - op: add
      path: /spec/rules/0/host
      value: policypal.localhost
