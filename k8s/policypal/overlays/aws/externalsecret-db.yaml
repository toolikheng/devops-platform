# The Postgres password, from SSM Parameter Store (Terraform writes it: terraform/persistent/policypal_secrets.tf).
# External Secrets Operator makes the Secret policypal-db with the one key Postgres and the API read, and
# refreshes it every hour. The API builds its database URL from it (base/api.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: policypal-db
  namespace: policypal
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-parameter-store
  target:
    name: policypal-db
  data:
  - secretKey: POSTGRES_PASSWORD
    remoteRef:
      key: /policypal/aws/db-password
