# The Postgres password, from SSM Parameter Store (Terraform writes it: terraform/persistent/policypal_secrets.tf).
# External Secrets Operator makes the Secret policypal-db with the two keys the pods read, both from the one
# parameter, and refreshes it every hour. The password is letters and digits, so the URL needs no escaping.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: policypal-db
  namespace: policypal
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-parameter-store
  target:
    name: policypal-db
    template:
      data:
        POSTGRES_PASSWORD: "{{ .password }}"
        DATABASE_URL: "postgresql+psycopg://policypal:{{ .password }}@postgres:5432/policypal"
  data:
  - secretKey: password
    remoteRef:
      key: /policypal/aws/db-password
