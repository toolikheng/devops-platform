# The admin token, from SSM Parameter Store (Terraform writes it: terraform/persistent/policypal_secrets.tf).
# External Secrets Operator makes the Secret policypal-admin and refreshes it every hour. After a rotation,
# the API reads the new token when it restarts (docs/runbook.md).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: policypal-admin
  namespace: policypal
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-parameter-store
  target:
    name: policypal-admin
    template:
      data:
        ADMIN_TOKEN: "{{ .token }}"
  data:
  - secretKey: token
    remoteRef:
      key: /policypal/aws/admin-token
