# The EC2 node. The ingress answers on any host name: the public IP changes every session and there is no DNS.
# The Secrets come from SSM Parameter Store through External Secrets Operator (make cloud-addons installs it).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base
- externalsecret-db.yaml
- externalsecret-admin.yaml
# The API alert (needs the monitoring's CRD: make cloud-addons before make cloud-deploy).
- prometheusrule.yaml

# The Grafana dashboard, wrapped in a ConfigMap Grafana's dashboard sidecar loads from this namespace
# (k8s/platform/kube-prometheus-stack/values-aws.yaml). No hash suffix: the name stays the same across deploys.
configMapGenerator:
- name: policypal-dashboard
  namespace: policypal
  files:
  - policypal-dashboard.json
  options:
    disableNameSuffixHash: true
    labels:
      grafana_dashboard: "1"

# The PolicyPal commit to run (its CI publishes an image per commit to GHCR; public, amd64 only).
# Quoted: a commit hash made only of digits would otherwise be a YAML number.
images:
- name: ghcr.io/toolikheng/policypal
  newTag: "5e6ecf1e9beae18ccddc20fe0895cf0790b70553"
