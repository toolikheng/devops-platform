# Where External Secrets Operator reads secrets: SSM Parameter Store in the project's region. There is no
# auth block, so no keys and no role to assume: the controller uses the node's instance role (IMDSv2), which
# may read /policypal/aws/* only (terraform/persistent/policypal_secrets.tf). Only ExternalSecrets in the
# policypal namespace may use this store.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-parameter-store
spec:
  conditions:
  - namespaces:
    - policypal
  provider:
    aws:
      service: ParameterStore
      region: ap-southeast-1
