services:
  node1:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: devops-node1
    hostname: node1
    ports:
      - "2201:22"
      - "9100:9100"
    networks:
      - homelab
    labels:
      devops.role: node
    restart: unless-stopped

  node2:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: devops-node2
    hostname: node2
    ports:
      - "2202:22"
      - "9101:9100"
    networks:
      - homelab
    labels:
      devops.role: node
    restart: unless-stopped

  node3:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: devops-node3
    hostname: node3
    ports:
      - "2203:22"
      - "9102:9100"
    networks:
      - homelab
    labels:
      devops.role: node
    restart: unless-stopped

networks:
  homelab:
    driver: bridge
