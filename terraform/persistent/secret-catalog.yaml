# Every secret Terraform keeps in SSM Parameter Store, by its name under /policypal/aws/.
#
# Terraform (policypal_secrets.tf) makes one random value and one SecureString per entry; its version is in
# variables.tf (secret_versions). The tests read this same file:
#   namespace: the Kubernetes namespace whose ExternalSecret reads it (External Secrets Operator).
#   no namespace: the node reads it itself with its role, never through External Secrets Operator.
# A description is what the AWS console shows; changing it updates the parameter in place.
db-password:
  description: "PolicyPal's Postgres password (POSTGRES_PASSWORD and DATABASE_URL). Rotation: docs/runbook.md."
  namespace: policypal
admin-token:
  description: "PolicyPal's admin token (X-Admin-Token). Rotation: raise admin_token_version, see docs/runbook.md."
  namespace: policypal
