prometheus:
  prometheusSpec:
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

    # Load every ServiceMonitor and PrometheusRule in the cluster, not only ones labelled
    # release=kube-prometheus-stack (our devops-app ServiceMonitor and alert rules have no such label).
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    additionalScrapeConfigs:
      - job_name: 'docker-nodes'
        static_configs:
          - targets:
              - 'host.k3d.internal:9100'
            labels:
              instance: 'devops-node1'
          - targets:
              - 'host.k3d.internal:9101'
            labels:
              instance: 'devops-node2'
          - targets:
              - 'host.k3d.internal:9102'
            labels:
              instance: 'devops-node3'

grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    size: 1Gi
  # No `datasources:` block here: the chart already provisions a default Prometheus datasource.
  # Defining a second default makes Grafana fail provisioning and crash-loop.

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi

prometheus-node-exporter:
  hostNetwork: true

kubeStateMetrics:
  enabled: true
