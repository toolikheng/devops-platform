apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: devops-app-alerts
  namespace: monitoring
spec:
  groups:
  - name: devops-app
    interval: 30s
    rules:
    - alert: AppDown
      expr: up{job="devops-app", namespace="devops"} == 0
      for: 1m
      annotations:
        summary: "DevOps app is down"
        description: "The devops-app pod has been down for 1 minute"
      labels:
        severity: critical

    - alert: HighErrorRate
      # Share of requests that returned 5xx (a ratio, so 0.05 = 5%).
      expr: |
        sum(rate(http_requests_total{job="devops-app", status=~"5.."}[5m]))
          / sum(rate(http_requests_total{job="devops-app"}[5m])) > 0.05
      for: 2m
      annotations:
        summary: "High error rate detected"
        description: "{{ $value | humanizePercentage }} of requests returned 5xx over the last 5 minutes"
      labels:
        severity: warning

    - alert: HighLatency
      # p95 over the last 5 minutes, across all pods and endpoints.
      expr: |
        histogram_quantile(0.95,
          sum by (le) (rate(http_request_duration_seconds_bucket{job="devops-app"}[5m]))) > 0.5
      for: 3m
      annotations:
        summary: "High request latency"
        description: "p95 latency is {{ $value | humanizeDuration }}"
      labels:
        severity: warning

    - alert: NodeExporterDown
      expr: up{job="docker-nodes"} == 0
      for: 1m
      annotations:
        summary: "Node exporter is down"
        description: "Node {{ $labels.instance }} exporter is unreachable"
      labels:
        severity: warning
