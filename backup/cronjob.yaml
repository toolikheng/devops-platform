apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: devops-backup-repo
  namespace: devops
  labels:
    app: devops-app
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: devops-app-backup
  namespace: devops
  labels:
    app: devops-app
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        spec:
          serviceAccountName: devops-app
          restartPolicy: OnFailure
          initContainers:
          # Consistent copy of the live database via SQLite's online backup API, safe while the app is writing.
          # restic then backs up this copy (as /app/app.db, the path restore-job.yaml expects), never the live file.
          - name: snapshot-db
            image: python:3.11.18-slim
            imagePullPolicy: IfNotPresent
            command: ["python", "-c"]
            args:
            - |
              import sqlite3
              src = sqlite3.connect("file:/data/app.db?mode=ro", uri=True)
              dst = sqlite3.connect("/snapshot/app.db")
              src.backup(dst)
              src.close()
              result = dst.execute("PRAGMA integrity_check").fetchone()[0]
              dst.close()
              if result != "ok":
                  raise SystemExit(f"integrity check of the copy failed: {result}")
              print("Online backup of /data/app.db -> /snapshot/app.db done, integrity_check: ok")
            volumeMounts:
            - name: app-data
              mountPath: /data
              readOnly: true
            - name: snapshot
              mountPath: /snapshot
          containers:
          - name: backup
            image: restic/restic:0.19.1
            imagePullPolicy: IfNotPresent
            command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Starting backup at $(date)"

              # Initialize restic repo if needed
              restic snapshots > /dev/null 2>&1 || restic init

              # Back up the consistent copy made by the snapshot-db init container
              restic backup /app \
                --tag "devops-app-backup" \
                --tag "$(date +%Y-%m-%d)"

              # Check integrity
              restic check

              # Cleanup old snapshots
              restic forget \
                --keep-daily 7 \
                --keep-weekly 4 \
                --keep-monthly 12 \
                --prune

              echo "Backup completed at $(date)"

            env:
            - name: RESTIC_REPOSITORY
              value: "/mnt/backups/restic-repo"
            - name: RESTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backup-credentials
                  key: password

            volumeMounts:
            - name: snapshot
              mountPath: /app
              readOnly: true
            - name: backup-repo
              mountPath: /mnt/backups

            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 512Mi

          volumes:
          - name: snapshot
            emptyDir: {}
          - name: app-data
            persistentVolumeClaim:
              claimName: devops-app-data
          - name: backup-repo
            persistentVolumeClaim:
              claimName: devops-backup-repo
