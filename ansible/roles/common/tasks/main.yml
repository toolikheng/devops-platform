---
- name: Update package cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install base packages
  apt:
    name:
      - curl
      - wget
      - git
      - htop
      - net-tools
      - jq
      - tmux
      # Needed by the timezone task on minimal images (zone files, and hwclock when there's no systemd).
      - tzdata
      - util-linux-extra
    state: present

- name: Set timezone to UTC
  timezone:
    name: Etc/UTC  # canonical name; Debian's tzdata rewrites plain "UTC" to this, which the module sees as drift

- name: Configure SSH hardening
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
  with_items:
    - regexp: "^PermitRootLogin"
      line: "PermitRootLogin without-password"
    - regexp: "^PubkeyAuthentication"
      line: "PubkeyAuthentication yes"
    - regexp: "^PasswordAuthentication"
      line: "PasswordAuthentication no"
  notify: reload sshd

- name: Create motd
  copy:
    dest: /etc/motd
    content: |
      ╔═══════════════════════════════════════╗
      ║   DevOps Platform - Homelab Node      ║
      ║   Managed by Ansible                  ║
      ╚═══════════════════════════════════════╝

- name: Ensure sshd is running
  service:
    name: ssh
    state: started
    enabled: yes
