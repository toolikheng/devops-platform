---
# Runs in check mode too: it only refreshes the package index, and without it check mode on a fresh
# cloud image (empty package lists) cannot tell which packages it would install.
- name: Update package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  check_mode: false

- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - git
      - htop
      - net-tools
      - jq
      - tmux
      # Needed by the timezone task on minimal images (zone files, and hwclock when there's no systemd).
      - tzdata
      - util-linux-extra
    state: present

- name: Set timezone to UTC
  community.general.timezone:
    name: Etc/UTC  # canonical name; Debian's tzdata rewrites plain "UTC" to this, which the module sees as drift

- name: Configure SSH hardening
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
  with_items:
    - regexp: "^PermitRootLogin"
      line: "PermitRootLogin {{ common_permit_root_login }}"
    - regexp: "^PubkeyAuthentication"
      line: "PubkeyAuthentication yes"
    - regexp: "^PasswordAuthentication"
      line: "PasswordAuthentication no"
  notify: Reload sshd

- name: Create motd
  ansible.builtin.copy:
    dest: /etc/motd
    mode: "0644"
    content: |
      ╔═══════════════════════════════════════╗
      ║   {{ '%-36s' | format(common_motd_title) }}║
      ║   Managed by Ansible                  ║
      ╚═══════════════════════════════════════╝

- name: Ensure sshd is running
  ansible.builtin.service:
    name: ssh
    state: started
    enabled: true
