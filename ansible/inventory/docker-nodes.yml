all:
  children:
    homelab:
      hosts:
        node1:
          ansible_host: localhost
          ansible_port: 2201
        node2:
          ansible_host: localhost
          ansible_port: 2202
        node3:
          ansible_host: localhost
          ansible_port: 2203
      vars:
        ansible_connection: ssh
        ansible_user: root
        # Throwaway containers get new host keys on every rebuild: don't record them in ~/.ssh/known_hosts.
        ansible_ssh_common_args: "-o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no"
