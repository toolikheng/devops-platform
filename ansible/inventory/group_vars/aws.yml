---
# How Ansible reaches the AWS node. scripts/aws-inventory.sh names the host by its instance ID, and SSH
# runs inside a Session Manager session to that ID (AWS-StartSSHSession), so the security group has no
# port 22. Two checks: IAM allows the session, then the key from the C2 key pair logs in as ubuntu.
ansible_user: ubuntu
ansible_become: true
# A new node and host key every session. The SSM session already goes to this exact instance ID, checked
# by AWS, so host keys are not recorded (as for the throwaway Docker nodes).
ansible_ssh_common_args: >-
  -o ProxyCommand="aws ssm start-session --region ap-southeast-1 --target %h
  --document-name AWS-StartSSHSession --parameters portNumber=%p"
  -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no
ansible_python_interpreter: /usr/bin/python3
# One SSH round trip per task instead of several (temp dir, copy, run, clean up), each through Session
# Manager. Measured back to back on a no-change run: 39 SSH calls instead of 151, but only about 10% faster
# (35-39 s against 39-44 s), because SSH already reuses one connection. Works with sudo because Ubuntu's
# sudoers has no requiretty.
ansible_pipelining: true

# The laptop's copy of the k3s admin kubeconfig (written by playbooks/aws-node.yml): outside the repo,
# mode 0600, because it holds cluster-admin credentials.
kubeconfig_path: "{{ lookup('env', 'HOME') }}/.kube/devops-aws.yaml"
# The localhost port make cloud-tunnel forwards to the node's 6443 (LOCAL_PORT in scripts/cloud-tunnel.sh).
kubeconfig_tunnel_port: 16443

common_permit_root_login: "no"
common_motd_title: DevOps Platform - AWS Node

# node_exporter reads *.prom files here; the backup writes the time of its last success
# (roles/restic_backup: restic_backup_textfile_dir, which tests/test_restic_backup.py keeps equal).
node_exporter_textfile_dir: /var/lib/node_exporter/textfile
