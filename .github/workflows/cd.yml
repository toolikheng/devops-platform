name: CD

# Deployment workflow: automatic from CI, or manual trigger
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      image_tag:
        description: 'Image tag (e.g., sha-abc1234 or latest)'
        required: true
        default: 'latest'
  workflow_call:
    inputs:
      environment:
        type: string
        default: 'dev'
      image_tag:
        type: string
        required: true

jobs:
  # APPROVAL GATE: Required for production deployments
  approval:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.environment == 'prod' || inputs.environment == 'prod' }}
    permissions:
      contents: read
    steps:
    - name: Request production approval
      run: |
        echo "🔒 Production deployment requires manual approval"
        echo "Environment: prod"
        echo "Image tag: ${{ github.event.inputs.image_tag || inputs.image_tag }}"
        echo ""
        echo "A team member must approve this deployment in GitHub Actions"
        echo "Approval timeout: 30 days"

  deploy:
    needs: [approval]
    if: ${{ always() && (github.event.inputs.environment == 'dev' || inputs.environment == 'dev' || needs.approval.result == 'success') }}
    runs-on: [self-hosted, k3d, kubernetes]  # ← Self-hosted runner
    permissions:
      contents: read
      packages: read

    steps:
    - uses: actions/checkout@v4

    - name: Verify cluster access
      run: |
        echo "✓ Runner authenticated via ServiceAccount: github-runner"
        echo "✓ RBAC: Can patch deployments, read pods/events"

        # Configure in-cluster kubeconfig
        if [ -f /var/run/secrets/kubernetes.io/serviceaccount/token ]; then
          export KUBECONFIG=/tmp/kubeconfig
          kubectl config set-cluster kubernetes --server=https://kubernetes.default.svc.cluster.local:443 --certificate-authority=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          kubectl config set-credentials github-runner --token=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          kubectl config set-context default --cluster=kubernetes --user=github-runner
          kubectl config use-context default
        fi

        # kubectl and kustomize should already be in PATH
        which kubectl
        kubectl version --client
        kubectl cluster-info
        kubectl get nodes -o wide

    - name: Deploy with kustomize
      run: |
        ENV=${{ github.event.inputs.environment || inputs.environment }}
        IMAGE_TAG=${{ github.event.inputs.image_tag || inputs.image_tag }}

        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "🚀 DEPLOYMENT AUDIT LOG"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "Environment: $ENV"
        echo "Image Tag: $IMAGE_TAG"
        echo "Triggered by: ${{ github.actor }}"
        echo "Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

        # Apply base manifests + overlay
        echo "Applying k8s/overlays/$ENV..."
        kubectl apply -k k8s/overlays/$ENV

        # Update image tag with audit trail
        echo "Updating image to: ghcr.io/${{ github.repository }}:$IMAGE_TAG..."
        kubectl set image deployment/devops-app \
          -n devops \
          devops-app=ghcr.io/${{ github.repository }}:$IMAGE_TAG \
          --record

        # Log deployment event
        kubectl create event deployment-$ENV \
          --namespace=devops \
          --type=Normal \
          --reason=DeploymentStarted \
          --message="Deployment $IMAGE_TAG to $ENV by ${{ github.actor }}" \
          --reporting-controller=github-actions \
          2>/dev/null || true

    - name: Verify rollout
      run: |
        ENV=${{ github.event.inputs.environment }}

        echo "Waiting for rollout to complete..."
        kubectl rollout status deployment/devops-app \
          -n devops \
          --timeout=5m

        echo "✓ Deployment successful"

        # Show deployment info
        kubectl get deployment,pods,svc -n devops
