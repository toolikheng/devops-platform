name: CD

# Manual deploy. Builds the image, creates an ephemeral k3d cluster on a
# GitHub-hosted runner, deploys the dev overlay, and smoke-tests /healthz and /readyz.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7

    - name: Install k3d and kubectl
      run: |
        curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
        curl -sLo kubectl "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
        sudo install kubectl /usr/local/bin/kubectl

    - name: Create ephemeral cluster
      run: k3d cluster create ci --agents 1 --wait --timeout 3m

    - name: Build and import image
      run: |
        docker build -t devops-app:latest app/
        k3d image import devops-app:latest -c ci

    - name: Deploy dev overlay
      run: |
        kubectl apply -k k8s/overlays/dev
        kubectl -n devops rollout status deployment/devops-app --timeout=180s

    - name: Smoke test
      run: |
        kubectl -n devops exec deploy/devops-app -- curl -sf http://localhost:8000/healthz
        kubectl -n devops exec deploy/devops-app -- curl -sf http://localhost:8000/readyz

    - name: Dump state on failure
      if: failure()
      run: |
        kubectl get all -A || true
        kubectl -n devops describe pods || true
        kubectl -n devops logs deploy/devops-app --tail=100 || true
