name: CD

# Manual deployment workflow for dev/prod environments
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      image_tag:
        description: 'Image tag (e.g., sha-abc1234 or latest)'
        required: true
        default: 'latest'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'

    - name: Install kustomize
      run: |
        curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
        sudo mv kustomize /usr/local/bin/

    - name: Configure kubectl context
      run: |
        # Decode kubeconfig from GitHub Secret
        echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
        chmod 600 ~/.kube/config

        # Verify connection
        kubectl cluster-info
        kubectl get nodes

    - name: Deploy with kustomize
      run: |
        ENV=${{ github.event.inputs.environment }}
        IMAGE_TAG=${{ github.event.inputs.image_tag }}

        echo "Deploying to $ENV environment with image tag: $IMAGE_TAG"

        # Apply base manifests + overlay
        kubectl apply -k k8s/overlays/$ENV

        # Update image tag
        kubectl set image deployment/devops-app \
          -n devops \
          devops-app=ghcr.io/${{ github.repository }}:$IMAGE_TAG \
          --record

    - name: Verify rollout
      run: |
        ENV=${{ github.event.inputs.environment }}

        echo "Waiting for rollout to complete..."
        kubectl rollout status deployment/devops-app \
          -n devops \
          --timeout=5m

        echo "✓ Deployment successful"

        # Show deployment info
        kubectl get deployment,pods,svc -n devops
