name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        cd app
        pip install -q -e .
        pip install -q ruff mypy types-requests

    - name: Run linters
      run: bash ci/lint.sh

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        cd app
        pip install -q -e .
        pip install -q pytest httpx

    - name: Run tests
      run: bash ci/test.sh

  hadolint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Lint Dockerfile
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: app/Dockerfile
        ignore: DL3008

  rules:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Test Prometheus alert rules
      run: bash ci/rules-test.sh

  infra-checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0 # the secret-scanning tests check the gitleaks rule against an old commit (7ca581f)

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Repo-level tests (cost check with a fake aws CLI, .gitignore rules)
      run: |
        pip install -q -r tests/requirements.txt
        python -m pytest -q tests

    - name: ShellCheck
      run: bash ci/shellcheck.sh

    # Pinned kustomize and kubeconform images; the manifest rules ran with the repo-level tests above.
    - name: Kubernetes checks (kustomize, kubeconform)
      run: bash ci/k8s-checks.sh

    - name: Ansible checks (ansible-lint, syntax-check)
      run: |
        pip install -q ansible-lint==26.11.0 ansible-core==2.21.6
        bash ci/ansible-checks.sh

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: 1.17.1
        terraform_wrapper: false

    # Offline: backends are skipped and terraform test uses mock providers, so no AWS credentials.
    - name: Terraform checks (fmt, validate, test, tflint, trivy)
      run: bash ci/terraform-checks.sh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # tflint plugin download (avoids API rate limits)

  build:
    needs: [lint, test, hadolint, rules, infra-checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
    - uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Container Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=sha,prefix=sha-,suffix=
          type=ref,event=branch

    - name: Build image (local)
      uses: docker/build-push-action@v7
      with:
        context: app
        file: app/Dockerfile
        load: true
        tags: devops-app:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Report: full SARIF for the Security tab. Never fails the job.
    - name: Run Trivy vulnerability scan (report)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        version: 'v0.75.0'
        image-ref: devops-app:${{ github.sha }}
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'HIGH,CRITICAL'
        exit-code: '0'

    - name: Upload Trivy results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: 'trivy-results.sarif'
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      continue-on-error: true

    # Gate: same threshold as ci/scan.sh. Runs before the push, so a vulnerable image is never published.
    - name: Fail on fixable HIGH/CRITICAL vulnerabilities (gate)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        version: 'v0.75.0'
        skip-setup-trivy: true
        image-ref: devops-app:${{ github.sha }}
        format: 'table'
        severity: 'HIGH,CRITICAL'
        ignore-unfixed: true
        exit-code: '1'

    - name: Build and push image (to GHCR)
      uses: docker/build-push-action@v7
      with:
        context: app
        file: app/Dockerfile
        push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
