# Scans the whole git history for secrets with the repo's gitleaks rules (ci/gitleaks.sh): on every pull
# request, every Monday, and on demand. The weekly run catches findings from rules added after a commit
# was scanned. Read-only: it needs no secrets and can't push.
name: Secret scan

on:
  pull_request:
  schedule:
    - cron: "0 1 * * 1" # Mondays 01:00 UTC (09:00 MYT)
  workflow_dispatch:

permissions: {}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0 # every commit: a shallow clone would scan one
        persist-credentials: false

    - name: Scan the full history (gitleaks, pinned image)
      run: bash ci/gitleaks.sh
